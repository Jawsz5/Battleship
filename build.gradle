plugins {
  id 'java'
  id 'application'
}

repositories { mavenCentral() }

application {
  mainClass = 'legacy.runner.Main'
}

dependencies {
  // JUnit 5
  testImplementation platform("org.junit:junit-bom:5.11.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly  "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
  jvmArgs '--add-modules=jdk.incubator.vector'
}

tasks.register('phase1Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs the single-thread Phase 1 legacy/optimized benchmark.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.benchmark.Phase1Benchmark'
  ['benchmark.warmupGames', 'benchmark.games', 'benchmark.trials'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
  }
}

tasks.register('phase2Parity', JavaExec) {
  group = 'verification'
  description = 'Runs exact BoostedNoHunt shot parity over deterministic fleets.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.ProbabilityParityCampaign'
  if (System.getProperty('phase2.parityFleets') != null) {
    args System.getProperty('phase2.parityFleets')
  }
}

tasks.register('phase2Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs the Phase 2 legacy/recompute/incremental probability benchmark.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase2ProbabilityBenchmark'
  ['phase2.warmupGames', 'phase2.trials', 'phase2.largeGames',
   'phase2.millionGames', 'phase2.microOperations'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
  }
}

tasks.register('phase3Parity', JavaExec) {
  group = 'verification'
  description = 'Runs exact Phase 3 bonus-graph shot parity over deterministic fleets.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase3ParityCampaign'
  if (System.getProperty('phase3.parityFleets') != null) {
    args System.getProperty('phase3.parityFleets')
  }
}

tasks.register('phase3Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs the Phase 3 A/B/C/D probability benchmark.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase3ProbabilityBenchmark'
  ['phase3.warmupGames', 'phase3.trials', 'phase3.largeGames', 'phase3.millionGames',
   'phase3.microOperations', 'phase3.onlyD', 'phase3.profileGames'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
