tasks.register('phase4Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs the Phase 4 scan/bucket/tournament selection benchmark.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase4ProbabilityBenchmark'
  ['phase4.warmupGames', 'phase4.trials', 'phase4.largeGames', 'phase4.millionGames',
   'phase4.microOperations', 'phase4.only', 'phase4.profileGames'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
