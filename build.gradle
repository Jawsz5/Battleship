tasks.register('phase5Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs fixed-worker independent-game Phase 5 scaling benchmarks.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase5MulticoreBenchmark'
  ['phase5.warmupGames', 'phase5.corpusGames', 'phase5.randomGames', 'phase5.trials',
   'phase5.workers'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
  }
}


java { 
    modularity.inferModulePath = false 
    toolchain {languageVersion = JavaLanguageVersion.of(23)}
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

tasks.register('phase6Benchmark', JavaExec) {
  group = 'benchmark'
  description = 'Runs final SIMD and lane-refilling batch experiments.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase6SimdBatchBenchmark'
  jvmArgs '--add-modules=jdk.incubator.vector'
  ['phase6.games', 'phase6.trials', 'phase6.widths', 'phase6.vectorOperations', 'phase6.singleWorker',
   'phase6.parallelWorkers'].each { key ->
    if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
  }
}
