tasks.register('phase4Parity', JavaExec) {
  group = 'verification'
  description = 'Runs exact Phase 4 selector parity over deterministic fleets.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'optimized.probability.Phase4ParityCampaign'
  if (System.getProperty('phase4.parityFleets') != null) {
    args System.getProperty('phase4.parityFleets')
  }
